<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>DITHER-OS Bartending</title>
    <meta
      name="description"
      content="DITHER-OS lounge bartender simulator — hosted on Hugging Face Spaces"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #eee;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        overflow: hidden;
      }
      /* FS68: full-bleed iframe only — no host header bar */
      .shell {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
      }
      .frame-wrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #eee;
      }
      .hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        color: #666;
        pointer-events: none;
        z-index: 0;
      }
      .hint code {
        color: #222;
        background: #ddd;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="frame-wrap">
        <p class="hint">
          Loading game…<br />
          If this stays blank, wait for the Space to wake.
        </p>
        <iframe
          id="game"
          title="DITHER-OS Bartending"
          allow="fullscreen; autoplay; clipboard-write"
          allowfullscreen
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
    <script>
      const SPACE_URL =
        "https://choppedcheese-dither-os-bartending.hf.space";
      document.getElementById("game").src = SPACE_URL;
    </script>
  </body>
</html>
