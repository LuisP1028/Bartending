<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>DITHER-OS Bartending</title>
    <meta
      name="description"
      content="DITHER-OS lounge bartender simulator — local standalone runtime"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #eee;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        overflow: hidden;
      }
      /* FS68: full-bleed iframe only — no host header bar */
      .shell {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
      }
      .frame-wrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #eee;
      }
      .hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        color: #666;
        pointer-events: none;
        z-index: 0;
      }
      .hint code {
        color: #222;
        background: #ddd;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="frame-wrap">
        <p class="hint">
          Loading game…<br />
          Connecting to DITHER-OS Bartending Mac Server Runtime (<code>https://rolled-blackberry-dairy-browsing.trycloudflare.com</code>).
        </p>
        <!--
          FS91 / FS021: camera must be delegated to the Mac server HTTPS iframe or getUserMedia
          fails with no permission prompt on the GitHub Pages shell.
        -->
        <iframe
          id="game"
          title="DITHER-OS Bartending"
          allow="fullscreen; autoplay; clipboard-write; camera; microphone"
          allowfullscreen
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
    <script>
      (function() {
        const DEFAULT_MAC_SERVER_URL = 'https://rolled-blackberry-dairy-browsing.trycloudflare.com';
        const params = new URLSearchParams(window.location.search);
        const explicitTarget = params.get('target');
        let targetUrl = DEFAULT_MAC_SERVER_URL;
        if (explicitTarget) {
          targetUrl = explicitTarget;
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          targetUrl = window.location.port === '3001' ? window.location.origin : 'http://localhost:3001';
        }
        document.getElementById("game").src = targetUrl;
      })();
    </script>
  </body>
</html>
